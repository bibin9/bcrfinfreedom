name: Update US ETF returns

# Fetches recent daily prices for the US ETFs in the fund list and saves their
# real 3- and 5-year growth to public/data/us-etf-returns.json. The app reads that
# file, so the numbers in the Funds tab stay current without anyone editing code.
on:
  schedule:
    - cron: "30 22 * * 1-5" # every weekday, after the US market closes (UTC)
  workflow_dispatch: {} # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch prices and compute returns
        run: node scripts/update-etf-returns.mjs
      - name: Commit if the numbers changed
        run: |
          if git diff --quiet -- public/data/us-etf-returns.json; then
            echo "No change."
          else
            git config user.name "bcr-fire-bot"
            git config user.email "bcr-fire-bot@users.noreply.github.com"
            git add public/data/us-etf-returns.json
            git commit -m "Update US ETF returns"
            git push
          fi
